<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Neeva Ayurveda</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0c0a09; color: white; font-family: 'Inter', sans-serif; }
        .reset-card { background: #1a1512; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 400px; }
        .reset-title { font-size: 1.5rem; margin-bottom: 30px; text-align: center; color: var(--amber-light); }
        .reset-form input { width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; }
        .reset-btn { width: 100%; padding: 15px; background: #3daa6a; border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
        .reset-msg { margin-top: 20px; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2 class="reset-title">Reset Your Password</h2>
        <form class="reset-form" id="resetForm">
            <input type="password" id="newPass" placeholder="New Password" required minlength="6">
            <input type="password" id="confirmPass" placeholder="Confirm Password" required minlength="6">
            <button type="submit" class="reset-btn">Update Password</button>
        </form>
        <div id="resetMsg" class="reset-msg"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const msg = document.getElementById('resetMsg');

            if (newPassword !== confirmPass) {
                msg.textContent = 'Passwords do not match';
                msg.style.color = '#ff6b6b';
                return;
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                msg.textContent = data.message;
                msg.style.color = '#3daa6a';
                if (data.success) {
                    setTimeout(() => window.location.href = 'index.html', 2000);
                }
            } catch (err) {
                msg.textContent = 'Reset failed. Token might be expired.';
                msg.style.color = '#ff6b6b';
            }
        });
    </script>
</body>
</html>
