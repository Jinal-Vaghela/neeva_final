<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order | Nutrala</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #3daa6a;
      --secondary: #2e7d4f;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #3daa6a;
    }

    body {
      background-color: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .order-info {
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
    }

    .order-id {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin: 0;
    }

    .order-date {
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    /* Stepper UI */
    .tracking-timeline {
      position: relative;
      padding-left: 50px;
      margin-top: 20px;
    }

    .tracking-timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 40px;
      opacity: 0.3;
      transition: all 0.5s ease;
    }

    .timeline-item.active {
      opacity: 1;
    }

    .timeline-item.completed {
      opacity: 0.8;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -30px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--border);
      border: 4px solid var(--card);
      z-index: 2;
      transition: all 0.3s ease;
    }

    .timeline-item.active::before {
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(61, 170, 106, 0.2);
    }

    .timeline-item.completed::before {
      background: var(--primary);
    }

    .timeline-content {
      transform: translateX(0);
    }

    .timeline-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .timeline-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .timeline-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      display: block;
    }

    .timeline-location {
        display: inline-block;
        padding: 4px 10px;
        background: rgba(61, 170, 106, 0.1);
        color: var(--primary);
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-top: 8px;
    }

    /* Pulse animation for active status */
    .timeline-item.active::before {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(61, 170, 106, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(61, 170, 106, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(61, 170, 106, 0); }
    }

    .status-badge {
        padding: 5px 15px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        background: #eee;
        color: #666;
    }

    .status-badge.shipped { background: #e0f2fe; color: #0284c7; }
    .status-badge.delivered { background: #dcfce7; color: #166534; }
    .status-badge.transit { background: #fef9c3; color: #854d0e; }

    #loading {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-weight: 600;
    }

    .estimate {
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        color: white;
        padding: 20px;
        border-radius: 16px;
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .estimate-title {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-bottom: 4px;
    }

    .estimate-date {
        font-size: 1.25rem;
        font-weight: 700;
    }

    @media (max-width: 600px) {
        .card { padding: 25px; }
        .container { margin: 20px auto; }
    }
  </style>
</head>
<body>

  <div id="loading">Gathering tracking data... 🌿</div>

  <div class="container">
    <div class="header">
        <a href="index.html" class="back-link">← Back to Shop</a>
        <div id="currentStatusBadge" class="status-badge">Processing</div>
    </div>

    <div class="card">
        <div class="order-info">
            <h1 class="order-id" id="displayOrderId">Order #000000</h1>
            <span class="order-date" id="displayOrderDate">April 10, 2026</span>
        </div>

        <div id="timeline" class="tracking-timeline">
            <!-- Timeline items will be injected here -->
        </div>

        <div class="estimate" id="deliveryEstimate" style="display: none;">
            <div>
                <div class="estimate-title">Estimated Delivery By</div>
                <div class="estimate-date" id="estDate">April 15, 2026</div>
            </div>
            <div style="font-size: 2rem;">🚚</div>
        </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        doc, 
        getDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) {
        alert('Order ID is missing');
        window.location.href = 'index.html';
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'index.html';
            return;
        }
        fetchTrackingData();
    });

    async function fetchTrackingData() {
        try {
            const docSnap = await getDoc(doc(db, "orders", orderId));
            if (docSnap.exists()) {
                const order = docSnap.data();
                renderTracking({ ...order, id: docSnap.id });
                document.getElementById('loading').style.display = 'none';
            } else {
                alert('Order not found');
                window.location.href = 'index.html';
            }
        } catch (err) {
            console.error('Fetch error:', err);
        }
    }

    function renderTracking(order) {
        const timeline = document.getElementById('timeline');
        const badge = document.getElementById('currentStatusBadge');
        const estBox = document.getElementById('deliveryEstimate');
        const estDate = document.getElementById('estDate');
        
        document.getElementById('displayOrderId').textContent = `Order #${String(order.id).slice(0,8).toUpperCase()}`;
        document.getElementById('displayOrderDate').textContent = order.created_at?.toDate().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        
        badge.textContent = order.status;
        badge.className = `status-badge ${order.status.toLowerCase()}`;

        // Estimate (5 days after creation)
        if (order.created_at) {
          const createdDate = order.created_at.toDate();
          const estimateDate = new Date(createdDate);
          estimateDate.setDate(createdDate.getDate() + 5);
          estDate.textContent = estimateDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          estBox.style.display = 'flex';
        }

        const statusOrder = [
            'PAID',
            'PACKED',
            'SHIPPED',
            'IN_TRANSIT',
            'OUT_FOR_DELIVERY',
            'DELIVERED'
        ];

        let html = '';
        const currentIndex = statusOrder.indexOf(order.status);

        statusOrder.forEach((status, idx) => {
            const isCompleted = idx < currentIndex || status === order.status;
            const isActive = status === order.status;
            
            html += `
                <div class="timeline-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}">
                    <div class="timeline-content">
                        <div class="timeline-title">${status}</div>
                        <div class="timeline-desc">
                            ${isActive && order.tracking_desc ? order.tracking_desc : getGenericDesc(status)}
                        </div>
                        ${isActive && order.current_location ? `<span class="timeline-location">📍 ${order.current_location}</span>` : ''}
                    </div>
                </div>
            `;
        });

        timeline.innerHTML = html;
    }

    function getGenericDesc(status) {
        const descs = {
            'PAID': 'Payment received. Preparing your wellness bundle.',
            'PACKED': 'Quality check complete. Item packed.',
            'SHIPPED': 'Order has left our main fulfillment center.',
            'IN_TRANSIT': 'Order is moving between facilities.',
            'OUT_FOR_DELIVERY': 'Our delivery partner is on the way to you.',
            'DELIVERED': 'Order received. Thank you for choosing Neeva!'
        };
        return descs[status] || 'Pending update.';
    }

    // Refresh every 30 seconds for simulation of "live"
    setInterval(fetchTrackingData, 30000);
  </script>
</body>
</html>
