<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | Neeva Ayurveda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-page { padding-top: 120px; min-height: 80vh; background: var(--bg-mid); }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; transition: var(--transition); }
    .btn-back:hover { color: var(--amber); transform: translateX(-5px); }
  </style>
</head>

<body>

  <div class="particles" id="particles"></div>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="logo-wrapper">
          <div class="logo-branch">
            <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 32 C 30 15, 70 15, 95 35" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
          <span class="logo-name">Neeva</span>
        </div>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#home" class="nav-link">Home</a></li>
        <li><a href="index.html#products" class="nav-link">Products</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
        <li><a href="orders.html" class="nav-link active" style="color: var(--amber);">Orders</a></li>
      </ul>
      <div class="nav-actions">
        <div id="userProfile" class="user-status">
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="nav-btn-logout" title="Logout">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="profile-page" style="padding-top: 100px;">
    <div class="profile-container" style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
      
      <div class="dashboard-layout" style="display: grid; grid-template-columns: 280px 1fr; gap: 40px; align-items: start;">
        
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar" style="background: white; border: 1px solid var(--card-border); padding: 30px; border-radius: 24px; position: sticky; top: 120px; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
          <div class="user-brief" style="margin-bottom: 30px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 25px;">
            <div class="avatar-circle" style="width: 60px; height: 60px; background: linear-gradient(135deg, var(--amber-dark), var(--amber-light)); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: white; font-size: 1.5rem; font-weight: 700;">
              <span id="nameInitial">U</span>
            </div>
            <h3 id="sideUserName" style="font-size: 1.1rem; color: var(--cream); margin: 0;">User Name</h3>
            <p id="sideUserEmail" style="font-size: 0.8rem; color: var(--text-muted); margin: 5px 0 0;">user@example.com</p>
          </div>
          
          <nav class="dash-nav" style="display: flex; flex-direction: column; gap: 8px;">
            <a href="profile.html" class="dash-link" style="padding: 12px 20px; border-radius: 12px; text-decoration: none; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: 0.3s;">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              My Profile
            </a>
            <a href="orders.html" class="dash-link active" style="padding: 12px 20px; border-radius: 12px; text-decoration: none; color: var(--amber-light); background: rgba(16, 185, 129, 0.08); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 12px;">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
              Order History
            </a>
            <a href="profile.html#addressesSection" class="dash-link" style="padding: 12px 20px; border-radius: 12px; text-decoration: none; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: 0.3s;">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              Addresses
            </a>
            <hr style="border: none; border-top: 1px solid #eee; margin: 10px 0;">
            <button id="logoutBtnAlt" style="padding: 12px 20px; border-radius: 12px; color: #ef4444; background: none; border: none; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; text-align: left; width: 100%;">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Logout
            </button>
          </nav>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-content">
          <div class="content-header" style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--cream); margin: 0;">My Orders</h1>
            <div id="orderStats" style="display: flex; gap: 20px;">
              <div class="stat-pill" style="padding: 8px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 50px; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
                Active: <span id="activeCount" style="color: var(--amber-dark);">0</span>
              </div>
              <div class="stat-pill" style="padding: 8px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 50px; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
                Total: <span id="totalCount" style="color: var(--cream);">0</span>
              </div>
            </div>
          </div>

          <div id="activeOrdersSection" style="margin-bottom: 50px;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
              <h2 style="font-size: 1.3rem; font-weight: 600; color: var(--text-primary); margin: 0;">Active Orders</h2>
              <div class="section-tag" style="margin: 0; padding: 3px 12px; font-size: 0.65rem; background: rgba(16, 185, 129, 0.1); color: var(--amber-dark); border-color: rgba(16, 185, 129, 0.2);">Ongoing</div>
            </div>
            <div id="activeOrdersList" style="display: flex; flex-direction: column; gap: 20px;">
              <!-- Loading state -->
              <div class="order-skeleton" style="height: 120px; background: #f1f5f9; border-radius: 20px; animation: pulse 1.5s infinite;"></div>
            </div>
          </div>

          <div id="pastOrdersSection">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
              <h2 style="font-size: 1.3rem; font-weight: 600; color: var(--text-primary); margin: 0;">Past Orders</h2>
              <div class="section-tag" style="margin: 0; padding: 3px 12px; font-size: 0.65rem; background: #f1f5f9; color: var(--text-muted); border-color: #e2e8f0;">History</div>
            </div>
            <div id="pastOrdersList" style="display: flex; flex-direction: column; gap: 20px;">
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom" style="border: none; justify-content: center;">
      <p>© 2024 Neeva. All Rights Reserved. Made with 🌿 in India</p>
    </div>
  </footer>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-msg" id="toastMsg">Updated!</span>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    // Custom logout for the dashboard button
    document.getElementById('logoutBtnAlt')?.addEventListener('click', () => {
      document.getElementById('logoutBtn').click();
    });

    // Update order counts
    async function updateOrderStats() {
      const activeList = document.getElementById('activeOrdersList');
      const pastList = document.getElementById('pastOrdersList');
      if (!activeList || !pastList) return;
      
      const activeCount = activeList.querySelectorAll('.order-card').length;
      const pastCount = pastList.querySelectorAll('.order-card').length;
      
      if (document.getElementById('activeCount')) document.getElementById('activeCount').textContent = activeCount;
      if (document.getElementById('totalCount')) document.getElementById('totalCount').textContent = activeCount + pastCount;
    }

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(async () => {
        const token = window.authToken || localStorage.getItem('neeva_token');
        if (token) {
          await fetchProfile();
          // The loadUserOrders in app.js is called by fetchProfile
          // We wait a bit then update stats
          setTimeout(updateOrderStats, 1000);
        }
      }, 500);
    });
  </script>
</body>
</html>
